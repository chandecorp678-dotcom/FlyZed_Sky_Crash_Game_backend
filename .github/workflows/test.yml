name: Demo Mode Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/demo-mode

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
